<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Presentation 3 – Digital Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#14202b; --muted:#4d5d6c;
  --line:#c3cfdb; --accent:#0b5c8f; --note:#f4c542; --note-ink:#2b2200;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1720; --surface:#18232f; --ink:#e8eef4; --muted:#9fb0c0;
    --line:#2c3b4a; --accent:#6bb7ea; --note:#e0b23a; --note-ink:#241c00;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}

header{padding:3.5rem 0 2rem}
h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:700;max-width:16ch}
.intro{max-width:62ch;color:var(--muted);margin:1rem 0 0;font-size:1.1rem}

/* The board: one card per portfolio section, like a Kanban row */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin:2rem 0 3rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card{display:flex;flex-direction:column;gap:.5rem;padding:1rem;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--note);border-radius:8px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-left-color:var(--accent)}
.card h3{font-size:1.1rem}
.card p{margin:0;font-size:.92rem;color:var(--muted)}
.card span{margin-top:auto;font-weight:600;color:var(--accent);font-size:.92rem}

section.part{padding:2.5rem 0;border-top:1px solid var(--line)}
section.part h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.lead{color:var(--muted);max-width:62ch;margin:.5rem 0 1.5rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem}
.panel h3{font-size:1.15rem;margin-bottom:.75rem}
.panel ul{margin:0;padding-left:1.1rem}
.panel li{margin:.35rem 0}
.panel img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin-top:.75rem}
.panel dt{font-weight:600;margin-top:.75rem}
.panel dd{margin:.15rem 0 0;color:var(--muted)}
.open{display:inline-block;margin-top:1.25rem;padding:.6rem 1rem;background:var(--accent);color:var(--bg);font-weight:600;border-radius:8px;text-decoration:none}
.open:hover{filter:brightness(1.1)}

#connect{background:var(--note);color:var(--note-ink);border-radius:14px;padding:1.75rem;margin:2.5rem 0}
#connect h2{font-size:1.6rem}
#connect p{max-width:68ch;margin:.75rem 0 0}

footer{padding:2rem 0 3rem;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line)}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name"></h1>
    <p class="intro" id="intro"></p>
  </header>

  <nav class="board" id="board" aria-label="Portfolio sections"></nav>

  <main id="sections"></main>

  <aside id="connect">
    <h2>Putting it all together</h2>
    <p id="overall"></p>
  </aside>

  <footer id="footer"></footer>
</div>

<script>
/* ============================================================
   EDIT THIS PART ONLY. Replace every YOUR_... placeholder.
   - repo: link to the section's own GitHub Pages site
   - evidence: files in this repo (put them in an "evidence" folder)
   - reflection: write in your own words
   ============================================================ */
const PORTFOLIO = {
  name: "STEPHEN HENDRICKS",
  studentNumber: "222774703",
  course: "Project Presentation 3 (PRP370S) · Diploma in ICT · CPUT",
  intro: "This portfolio collects the Agile work from my project. Each section has the evidence I produced and a reflection on what I learned from it.",
  overall: "Write 1–2 paragraphs here that tie all five sections together. For example, explain how the charter shaped your working agreements, how the stories became backlog items, how the sprint backlog guided your work, and what the logbook showed you about your team.",
  sections: [
    {
      id: "charter",
      title: "Agile Team Charter",
      summary: "How my team agreed to work together.",
      repo: "https://YOUR_USERNAME.github.io/agile-team-charter/",
      evidence: [
        { label: "Team charter (PDF)", href: "evidence/team-charter.pdf" }
      ],
      image: "",
      reflection: {
        did: "Describe what you and your team did to create the charter.",
        learned: "What did you learn about teamwork and working agreements?",
        next: "How will you use this in future projects?"
      }
    },
    {
      id: "stories",
      title: "User Stories and Tasks",
      summary: "Features described from the user’s point of view, broken into tasks.",
      repo: "https://YOUR_USERNAME.github.io/user-stories-tasks/",
      evidence: [
        { label: "User stories and tasks (PDF)", href: "evidence/user-stories.pdf" },
        { label: "Trello board", href: "https://trello.com/b/YOUR_BOARD" }
      ],
      image: "",
      reflection: {
        did: "Describe how you wrote the stories and split them into tasks.",
        learned: "What was hard or surprising about writing good user stories?",
        next: "What would you do differently next time?"
      }
    },
    {
      id: "product-backlog",
      title: "Product Backlog",
      summary: "The prioritised list of everything the product needs.",
      repo: "https://YOUR_USERNAME.github.io/product-backlog/",
      evidence: [
        { label: "Product backlog (PDF)", href: "evidence/product-backlog.pdf" }
      ],
      image: "",
      reflection: {
        did: "Explain how you built and prioritised the backlog.",
        learned: "What did prioritising teach you about value and effort?",
        next: "How would you keep the backlog up to date on a real project?"
      }
    },
    {
      id: "sprint-backlog",
      title: "Sprint Backlog",
      summary: "The work chosen to reach the sprint goal.",
      repo: "https://YOUR_USERNAME.github.io/sprint-backlog/",
      evidence: [
        { label: "Sprint backlog (PDF)", href: "evidence/sprint-backlog.pdf" }
      ],
      image: "",
      reflection: {
        did: "Explain your sprint goal and how you picked the work for it.",
        learned: "How did planning a sprint differ from planning the whole project?",
        next: "What would you change in your next sprint plan?"
      }
    },
    {
      id: "logbook",
      title: "Agile Logbook",
      summary: "Daily stand-ups, sprint plans and retrospective notes.",
      repo: "https://YOUR_USERNAME.github.io/agile-logbook/",
      evidence: [
        { label: "Agile logbook (PDF)", href: "evidence/agile-logbook.pdf" }
      ],
      image: "",
      reflection: {
        did: "Summarise what you recorded in stand-ups and retrospectives.",
        learned: "What patterns or problems did the logbook reveal?",
        next: "How will regular reflection improve your future work?"
      }
    }
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
document.title = PORTFOLIO.name + " – Digital Portfolio";
$("name").textContent = PORTFOLIO.name;
$("intro").textContent = PORTFOLIO.intro;
$("overall").textContent = PORTFOLIO.overall;
$("footer").textContent = PORTFOLIO.name + " · " + PORTFOLIO.studentNumber + " · " + PORTFOLIO.course;

$("board").innerHTML = PORTFOLIO.sections.map(s => `
  <a class="card" href="#${s.id}">
    <h3>${s.title}</h3>
    <p>${s.summary}</p>
    <span>View section</span>
  </a>`).join("");

$("sections").innerHTML = PORTFOLIO.sections.map(s => `
  <section class="part" id="${s.id}">
    <h2>${s.title}</h2>
    <p class="lead">${s.summary}</p>
    <div class="cols">
      <div class="panel">
        <h3>Evidence</h3>
        <ul>${s.evidence.map(e => `<li><a href="${e.href}">${e.label}</a></li>`).join("")}</ul>
        ${s.image ? `<img src="${s.image}" alt="${s.title} evidence">` : ""}
      </div>
      <div class="panel">
        <h3>Reflection</h3>
        <dl>
          <dt>What I did</dt><dd>${s.reflection.did}</dd>
          <dt>What I learned</dt><dd>${s.reflection.learned}</dd>
          <dt>What I will do next</dt><dd>${s.reflection.next}</dd>
        </dl>
      </div>
    </div>
    <a class="open" href="${s.repo}">Open the ${s.title} site</a>
  </section>`).join("");
</script>
</body>
</html>
